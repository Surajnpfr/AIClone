# Example XTTS fine-tune configuration.
# Replace the placeholder paths with your actual dataset and checkpoint info.

trainer:
  precision: bf16-mixed
  max_steps: 2000
  save_interval: 250
  gradient_accumulation_steps: 2
  learning_rate: 1.0e-4
  batch_size: 2

dataset:
  manifest: data/audio/clean.wav
  language: en
  speaker_name: "primary"
  validation_split: 0.1

model:
  base_checkpoint: "coqui/XTTS-v2"
  output_dir: "models/voice-xtts"
  text_cleaner: "english_cleaners"

logging:
  project: "ai-clone"
  run_name: "voice-ft"
  save_config: true
